# working directory
BASE_DIR: "~/chrombpnet/chrombpnet_use_snakefile/Treeshrew/TS_C10Hepatocytes"

# contains .narrowPeak for each sample
INPUT_PEAK_DIR: "~/Treeshrew/FileSave/TreeShrew_peak_1000bp_OBO/modified_peak"

# contains deduped .bed for each sample
INPUT_BED_DIR: "~/Treeshrew/FileSave/bed_by_celltype_for_traning/bed_after_sort"

# resource directory that has genome fasta, genome sizes and blacklist information
#    if any of these files do not exist automatically download from encode
RESOURCE_DIR: "~/software/ref_tree_shrew/TreeShrew_scATAC_ref/fasta"
RESOURCE:
    GENOME: "genome.fa"
    CHROMSIZE: "genome.chrom.sizes"
    #BLACKLIST: "blacklist.bed.gz"
    #BLACK_TMP_BED: "temp.bed"
# chromosome splits for training
FOLD_DIR: "~/chrombpnet/old/chrombpnet_TS_Mono/fold_split_version2/data/splits"
FOLD: 
  "0": "fold_0.json"
  "1": "fold_1.json"
  "2": "fold_2.json"
  "3": "fold_3.json"
  "4": "fold_4.json"

CELLTYPE: ["C10.1"]

# path to selected bias model
BIAS_MODEL: "~/chrombpnet/chrombpnet_TS_brain_pericytes/bias_model/fold_0/threshold_08/models/TS_brain_pericytes_1000bp_fold0_08_bias.h5"