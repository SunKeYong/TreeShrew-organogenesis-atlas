#创建chrombpnetv8环境的yaml文件：conda env create -f chrombpnetv8.yaml
name: chrombpnetv8
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  # CUDA,根据tensorflow版本调整
  - cudatoolkit=11.2
  - cudnn=8.1
  # 生物信息学工具
  - samtools
  - bedtools
  - ucsc-bedgraphtobigwig
  - pybigwig
  - meme
  - h5py>=2.10.0
  - matplotlib>=3.3.1
  - matplotlib-venn=0.11.6
  - numpy=1.23.4
  - pandas>=1.3.4
  - pyfaidx=0.6.1
  - scikit-learn>=1.1.2
  - scipy>=1.4.1
  - protobuf=3.20
  - tqdm=4.48.2
  - deepdish=0.3.7
  - deeplift=0.6.13.0
  - weasyprint=52.5
  # Python包（通过conda安装）
  - pycairo
  - pip
  - pip:
    # 通过pip安装的包
    - tensorflow==2.8.0 
    - tensorflow-estimator==2.8.0 
    - tensorflow-probability==0.15.0
    - modisco==0.5.16.0
    - modisco-lite==2.0.7
    - kundajelab-shap==1
    #- git+https://github.com/kundajelab/shap@master
